[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "esback"
version = "0.1.0"
description = "Backtesting Expected Shortfall — a research framework for ES backtests across GARCH variants, asset classes, and crisis periods."
authors = [{ name = "Dan Allouche" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "expected-shortfall",
  "backtesting",
  "risk-management",
  "value-at-risk",
  "garch",
  "quantitative-finance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.1",
  "pandas>=2.2",
  "scipy>=1.14",
  "arch>=7",
  "yfinance>=0.2.40",
  "pyarrow>=18",
  "matplotlib>=3.9",
  "typer>=0.12",
  "pyyaml>=6",
  "rich>=13",
  "torch>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.7",
  "mypy>=1.13",
  "pre-commit>=4",
  "types-PyYAML>=6",
]

[project.scripts]
esback = "esback.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/esback"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "N",   # pep8-naming
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = [
  "E501", # line length handled by formatter
  "N803", # uppercase argument names (H_t, R_j, ...) follow paper notation
  "N806", # uppercase variable names (H_t, U_ES, R_j, ...) follow paper notation
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
